name: Sync rehab-desk PWA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-rehab-desk
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Download site package
        run: |
          curl -fSL --max-time 120 -o site.zip "https://aka.doubaocdn.com/s/C0VfrBPWmt"
          ls -l site.zip
          rm -rf _site _tmp
          mkdir -p _site _tmp
          unzip -q site.zip -d _tmp
          cp -r _tmp/gh/. _site/
          ls -la _site

      - name: Publish into gh-pages/rehab-desk
        run: |
          git config --global user.name "rehab-desk-bot"
          git config --global user.email "xcaihgga@users.noreply.github.com"
          git fetch origin gh-pages
          rm -rf /tmp/gp && mkdir -p /tmp/gp
          git worktree add --detach /tmp/gp origin/gh-pages
          rm -rf /tmp/gp/rehab-desk
          cp -r _site /tmp/gp/rehab-desk
          cd /tmp/gp
          git add -A rehab-desk
          git commit -m "sync: 康复病历工作台 PWA" || echo "no change"
          git push origin HEAD:gh-pages
